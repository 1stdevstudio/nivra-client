name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fabric-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Nivra Client
        run: bash ./gradlew build
      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nivra-client-jars
          path: build/libs/*.jar
